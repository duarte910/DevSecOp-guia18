# =========================================================================
# cicd.yml — Pipeline completo CI/CD con DefectDojo (4 Fases)
# =========================================================================

name: CI/CD Pipeline - Notes App DevSecOps con DefectDojo (4 Fases)

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-portfolio
  PYTHON_VERSION: "3.12"
  HELM_RELEASE_NAME: mi-app
  K8S_NAMESPACE: devops-portfolio
  DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
  DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_API_KEY }}
  PRODUCT_ID: "1"

jobs:
  # ── Job 1: Lint ────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: devops-TP06/backend/requirements.txt
      - name: Instalar dependencias de lint
        run: pip install flake8 yamllint
      - name: Lint Python (flake8)
        run: |
          flake8 devops-TP06/backend/ \
            --max-line-length=100 \
            --exclude=devops-TP06/backend/tests/ \
            --count --statistics
      - name: Lint YAML (yamllint)
        run: |
          yamllint -c .yamllint.yml \
            devops-TP06/docker-compose.yml \
            .github/workflows/

  # ── Job 2: Test ────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: devops-TP06/backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r devops-TP06/backend/requirements.txt
      - name: Correr tests con cobertura
        run: |
          cd devops-TP06/backend
          pytest tests/ --cov=. --cov-report=term-missing --cov-report=xml -v

  # ── Job 3: Test de la app integrada (devops-tp12) ──────
  test-integrated-app:
    name: Test App Integrada (devops-tp12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: devops-tp12/app/backend/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r devops-tp12/app/backend/requirements-dev.txt
      - name: Lint (flake8)
        run: |
          flake8 devops-tp12/app/backend/app.py \
            --max-line-length=100 \
            --extend-ignore=E302,E701,E702,W391
      - name: Tests con cobertura
        run: |
          cd devops-tp12/app/backend
          pytest tests/ --cov=. --cov-report=term-missing -v

  # ── FASE 1: BUILD & PACKAGE ─────────────────────────────
  build-and-package:
    name: "Fase 1: Build & Package (Imagen Inmutable)"
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Compilar imagen Docker
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ./devops-tp12/app/backend
          docker build -t notes-frontend:${{ github.sha }} ./devops-tp12/app/frontend
      - name: Exportar imagen a tarball efímero
        run: |
          mkdir -p build-artifacts
          docker save ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            notes-frontend:${{ github.sha }} \
            -o build-artifacts/app-image.tar
      - name: Publicar Artefacto de Imagen
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-artifact
          path: build-artifacts/app-image.tar
          retention-days: 1

  # ── FASE 2: AUDITORÍAS (Generación de JSONs) ────────────
  security-audits:
    name: "Fase 2: Auditorías (Threagile, Semgrep, Trivy, Gitleaks)"
    runs-on: ubuntu-latest
    needs: [build-and-package]
    steps:
      - name: Checkout del código (Historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear carpeta para reportes JSON
        run: mkdir -p reports-json

      - name: Descargar Artefacto de Imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: build-artifacts

      - name: Cargar imagen Docker compilada
        run: docker load -i build-artifacts/app-image.tar

      - name: Instalar Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Renderizar Helm Chart (TP10B)
        run: |
          cd devops-tp12
          helm template ${{ env.HELM_RELEASE_NAME }} ./chart -f values-local.yaml > manifests-rendered-prod.yaml

      # ── 2A: THREAGILE THREAT MODELING ──
      - name: Ejecutar Threagile Threat Model Analysis
        uses: threagile/run-threagile-action@v1
        with:
          model-file: 'devops-tp12/threagile.yaml'
          output-dir: 'reports-json'
        continue-on-error: true
      - name: Renombrar output de Threagile
        run: mv reports-json/threagile/output/threagile.json reports-json/threagile-results.json || true

      # ── 2B: SEMGREP SAST SCAN ──
      - name: Ejecutar Semgrep SAST
        run: |
          python3 -m pip install semgrep
          semgrep scan --config=p/owasp-top-ten --config=p/python --config=p/dockerfile \
            --json -o reports-json/semgrep-results.json devops-tp12/app || true

      # ── 2C: TRIVY CONTAINER SCAN ──
      - name: Ejecutar Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_IMAGE }}:${{ github.sha }}'
          format: 'json'
          output: 'reports-json/trivy-container-results.json'
          exit-code: '0'

      # ── 2D: GITLEAKS SECRET SCANNING ──
      - name: Ejecutar Gitleaks CLI
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --source . --report-format json --report-path reports-json/gitleaks-report.json || true

      - name: Publicar Artefacto de Reportes JSON
        uses: actions/upload-artifact@v4
        with:
          name: security-json-reports
          path: reports-json/
          retention-days: 1

  # ── FASE 2.E: OWASP ZAP DAST SCAN (Paralelo por K3d) ────
  dast-zap-scan:
    name: "Fase 2: OWASP ZAP (DAST)"
    runs-on: ubuntu-latest
    needs: [build-and-package]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Descargar Artefacto de Imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: build-artifacts
      - name: Cargar imagen Docker compilada
        run: docker load -i build-artifacts/app-image.tar
      - name: Instalar k3d
        run: curl --fail --silent https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
      - name: Instalar Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'
      - name: Crear clúster efímero de pruebas
        run: k3d cluster create zap-cluster -p "18080:80@loadbalancer" --wait
      - name: Importar imagen al clúster k3d
        run: |
          k3d image import ${{ env.DOCKER_IMAGE }}:${{ github.sha }} -c zap-cluster
          k3d image import notes-frontend:${{ github.sha }} -c zap-cluster
      - name: Desplegar aplicación con Helm
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} devops-tp12/chart \
            -f devops-tp12/values-local.yaml \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --set backend.image.repository=${{ env.DOCKER_IMAGE }} \
            --set backend.image.tag=${{ github.sha }} \
            --set backend.image.pullPolicy=Never \
            --set frontend.image.repository=notes-frontend \
            --set frontend.image.tag=${{ github.sha }} \
            --set frontend.image.pullPolicy=Never
          kubectl wait --for=condition=available deployment --all -n ${{ env.K8S_NAMESPACE }} --timeout=120s || exit 1
      - name: Ejecutar Job de OWASP ZAP
        run: |
          kubectl apply -f guia-13/k8s/04-zap-job.yaml
          for i in {1..30}; do
            if kubectl get job zap-security-scan -n ${{ env.K8S_NAMESPACE }} \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' \
              | grep -q "True"; then break; fi
            if kubectl get job zap-security-scan -n ${{ env.K8S_NAMESPACE }} \
              -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' \
              | grep -q "True"; then break; fi
            sleep 10
          done
      - name: Extraer reportes de ZAP
        if: always()
        run: |
          sed -i 's/timeout=60s/timeout=120s/g' guia-13/scripts/extract-zap-reports.sh
          ./guia-13/scripts/extract-zap-reports.sh
      - name: Publicar Artifact de Reportes ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-reports
          path: guia-13/reportes/

  # ── FASE 3: CENTRALIZACIÓN EN OWASP DEFECTDOJO ──────────
  defectdojo-import:
    name: "Fase 3: Centralización en DefectDojo (cURL)"
    runs-on: ubuntu-latest
    needs: [security-audits, dast-zap-scan]
    if: always()
    steps:
      - name: Descargar Reportes JSON
        uses: actions/download-artifact@v4
        with:
          name: security-json-reports
          path: reports-json
      - name: Descargar Reportes ZAP
        uses: actions/download-artifact@v4
        with:
          name: owasp-zap-reports
          path: reports-zap

      - name: Inyectar Threagile
        run: |
          if [ -f "reports-json/threagile-results.json" ]; then
            curl -s -X POST "${{ env.DEFECTDOJO_URL }}/api/v2/import-scan/" \
              -H "Authorization: Token ${{ env.DEFECTDOJO_TOKEN }}" \
              -F "product_id=${{ env.PRODUCT_ID }}" \
              -F "product_name=Notes App" \
              -F "scan_type=Generic CI/CD Audit" \
              -F "engagement_name=CI/CD Automated Security Audits" \
              -F "auto_create_context=true" \
              -F "file=@reports-json/threagile-results.json"
          fi

      - name: Inyectar Semgrep
        run: |
          if [ -f "reports-json/semgrep-results.json" ]; then
            curl -s -X POST "${{ env.DEFECTDOJO_URL }}/api/v2/import-scan/" \
              -H "Authorization: Token ${{ env.DEFECTDOJO_TOKEN }}" \
              -F "product_id=${{ env.PRODUCT_ID }}" \
              -F "product_name=Notes App" \
              -F "scan_type=Semgrep JSON Report" \
              -F "engagement_name=CI/CD Automated Security Audits" \
              -F "auto_create_context=true" \
              -F "file=@reports-json/semgrep-results.json"
          fi

      - name: Inyectar Trivy
        run: |
          if [ -f "reports-json/trivy-container-results.json" ]; then
            curl -s -X POST "${{ env.DEFECTDOJO_URL }}/api/v2/import-scan/" \
              -H "Authorization: Token ${{ env.DEFECTDOJO_TOKEN }}" \
              -F "product_id=${{ env.PRODUCT_ID }}" \
              -F "product_name=Notes App" \
              -F "scan_type=Trivy Scan" \
              -F "engagement_name=CI/CD Automated Security Audits" \
              -F "auto_create_context=true" \
              -F "file=@reports-json/trivy-container-results.json"
          fi

      - name: Inyectar Gitleaks
        run: |
          if [ -f "reports-json/gitleaks-report.json" ]; then
            curl -s -X POST "${{ env.DEFECTDOJO_URL }}/api/v2/import-scan/" \
              -H "Authorization: Token ${{ env.DEFECTDOJO_TOKEN }}" \
              -F "product_id=${{ env.PRODUCT_ID }}" \
              -F "product_name=Notes App" \
              -F "scan_type=Gitleaks Scan" \
              -F "engagement_name=CI/CD Automated Security Audits" \
              -F "auto_create_context=true" \
              -F "file=@reports-json/gitleaks-report.json"
          fi

      - name: Inyectar ZAP DAST
        run: |
          echo "Buscando reportes de ZAP..."
          find reports-zap/ -type f
          ZAP_FILE=$(find reports-zap/ -type f \( -name "*.json" -o -name "*.xml" \) | head -n 1)
          if [ -n "$ZAP_FILE" ]; then
            echo "Encontrado reporte ZAP: $ZAP_FILE"
            curl -s -X POST "${{ env.DEFECTDOJO_URL }}/api/v2/import-scan/" \
              -H "Authorization: Token ${{ env.DEFECTDOJO_TOKEN }}" \
              -F "product_id=${{ env.PRODUCT_ID }}" \
              -F "product_name=Notes App" \
              -F "scan_type=ZAP Scan" \
              -F "engagement_name=CI/CD Automated Security Audits" \
              -F "auto_create_context=true" \
              -F "file=@$ZAP_FILE"
          else
            echo "ALTEADO: No se encontró ningún archivo de reporte de ZAP."
          fi

  # ── FASE 4: RELEASE & DEPLOY ────────────────────────────
  deploy-k8s-helm:
    name: "Fase 4: Release & Deploy Helm K8s"
    runs-on: ubuntu-latest
    needs: [defectdojo-import]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Descargar Artefacto de Imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: build-artifacts
      - name: Cargar imagen Docker probada
        run: docker load -i build-artifacts/app-image.tar
      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Etiquetar y Push a Docker Hub
        run: |
          docker tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ${{ env.DOCKER_IMAGE }}:latest
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE }}:latest
      - name: Despliegue con Helm en Kubernetes
        run: echo "Desplegando Helm Chart en Kubernetes..."
